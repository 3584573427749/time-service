openapi: 3.0.3
info:
  title: Auth Service API
  version: 0.0.1
  description: >-
    OpenAPI för hantering av tidsrapportering i simning.ax-miljön

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Service health information
      responses:
        '200':
          description: Health information
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - data
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    required:
                      - status
                      - service
                      - version
                      - checks
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                          - degraded
                      service:
                        type: string
                        example: auth-service
                      version:
                        type: string
                        example: 1.5.0
                      checks:
                        type: object
                        additionalProperties:
                          type: string
  /users:
    post:
      summary: Create user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid JSON
        '409':
          description: User already exists
        '422':
          description: Validation error

components:
  schemas:
    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        firstName:
          type: string
          minLength: 2
          example: User
        lastName:
          type: string
          minLength: 2
          example: Name

    User:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - roles
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            type: string
          example:
            - user
          createdAt:
            type: string
            format: date-time