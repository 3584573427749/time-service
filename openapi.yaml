openapi: 3.0.3
info:
  title: Time Service API
  version: 0.0.2
  description: >-
    OpenAPI för hantering av tidsrapportering i simning.ax-miljön

servers:
  - url: http://localhost:8080

paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - Health
      summary: Service health information
      responses:
        '200':
          description: Health information
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - data
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: object
                    required:
                      - status
                      - service
                      - version
                      - checks
                    properties:
                      status:
                        type: string
                        enum:
                          - ok
                          - degraded
                      service:
                        type: string
                        example: auth-service
                      version:
                        type: string
                        example: 1.5.0
                      checks:
                        type: object
                        additionalProperties:
                          type: string

  /users:
    get:
      summary: Get all users
      operationId: getUsers
      tags:
        - Users
      responses:
        200:
          description: A list of users
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - data
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
    post:
      summary: Adds or updates a user
      operationId: upsertUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User created or updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - data
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Invalid Request
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 422
                  error:
                    $ref: '#/components/schemas/ErrorResponse'
  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - data
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  data:
                    $ref: '#/components/schemas/User'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete user by ID
      description: Delete a user by its unique identifier
      operationId: deleteUserById
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'


  /time-entry:
    post:
      tags:
        - TimeEntry
      summary: Lägg till tidspost
      operationId: addTimeEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryRequest'
      responses:
        '201':
          description: Tidspost skapad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

        '400':
          description: Felaktig indata
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '422':
          description: Valideringsfel
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

  /time-entry/{id}:
    get:
      tags:
        - TimeEntry
      summary: Hämta tidspost
      operationId: getTimeEntry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Tidspost hittad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

        '400':
          description: Felaktigt id
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Tidspost saknas
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - TimeEntry
      summary: Uppdatera tidspost
      operationId: updateTimeEntry

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryRequest'

      responses:
        '200':
          description: Tidspost uppdaterad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

        '400':
          description: Felaktigt id eller affärsregelbrott
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Tidspost saknas
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '422':
          description: Valideringsfel
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 422
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - TimeEntry
      summary: Ta bort tidspost

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '204':
          description: Tidspost borttagen

        '400':
          description: Felaktigt id
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Tidspost saknas
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

  /time-entry/{id}/approve:
    put:
      tags:
        - TimeEntry
      summary: Attestera tidspost
      operationId: approveTimeEntry

      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Tidspost attesterad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'

        '400':
          description: Felaktigt id
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Tidspost saknas
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 404
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Tidsposten är redan attesterad
          content:
            application/json:
              schema:
                type: object
                required:
                  - statusCode
                  - error
                properties:
                  statusCode:
                    type: integer
                    example: 409
                  error:
                    $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - type
        - message
      properties:
        type:
          type: string
        message:
          type: string
        details:
          type: object
          nullable: true
          additionalProperties: true

    CreateUserRequest:
      type: object
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        firstName:
          type: string
          minLength: 2
          example: User
        lastName:
          type: string
          minLength: 2
          example: Name

    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - active
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        active:
          type: integer
          enum:
            - 0
            - 1
          example: 1
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    TimeEntryRequest:
      type: object
      required:
        - userId
        - date
        - duration
        - activityRole
      properties:
        userId:
          type: string
          format: uuid

        date:
          type: string
          format: date

        duration:
          type: string
          example: "03:05:00"

        activityRole:
          type: string
          example: "Ledare"

        groupId:
          type: string
          format: uuid
          nullable: true

        comment:
          type: string
          nullable: true

    TimeEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid

        userId:
          type: string
          format: uuid

        date:
          type: string
          format: date

        duration:
          type: string
          example: "03:05:00"

        activityRole:
          type: string

        groupId:
          type: string
          format: uuid
          nullable: true

        comment:
          type: string
          nullable: true

        approvedBy:
          type: string
          format: uuid
          nullable: true

        approvedAt:
          type: string
          format: date-time
          nullable: true

        exportedBy:
          type: string
          format: uuid
          nullable: true

        exportedAt:
          type: string
          format: date-time
          nullable: true

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time
          nullable: true