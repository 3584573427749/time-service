services:
  time-service:
    container_name: time-service
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"

  auth-service:
    container_name: auth-service
    image: ghcr.io/3584573427749/auth-service:latest
    restart: unless-stopped

  group-service:
    container_name: group-service
    image: ghcr.io/3584573427749/group-service:latest
    restart: unless-stopped